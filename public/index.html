<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>U12 备课助手</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#EDEDED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="U12备课">
<style>
/* Layout: a familiar phone chat. Fixed top bar, scrolling messages, fixed composer. Plans arrive as cards inside the assistant's bubbles. */
:root {
  --bg: #EDEDED; --bar: #F7F7F7; --bubble-in: #FFFFFF; --bubble-out: #A9EA7A; --ink: #191919; --muted: #7F7F7F; --line: #DADADA;
  --accent: #07A35A; --accent-ink: #FFFFFF; --card: #F7F8FA; --warn-bg: #FFF5E0; --warn: #8A5300; --err-bg: #FDECEC; --err: #A11D1D;
  --p1: #E8743B; --p2: #2E9C74; --p3: #6A55D6; --p4: #2B7BD0; --p5: #C79A12;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --bar: #1E1E1E; --bubble-in: #2C2C2C; --bubble-out: #3EB575; --ink: #E9E9E9; --muted: #8F8F8F; --line: #333333;
  --accent: #2DBE73; --accent-ink: #08130D; --card: #242424; --warn-bg: #3A2C10; --warn: #F2C97C; --err-bg: #3A1616; --err: #F4A3A3;
  --p1: #F08A55; --p2: #4CC398; --p3: #9A88F0; --p4: #5AA6E8; --p5: #E0B547; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111111; --bar: #1E1E1E; --bubble-in: #2C2C2C; --bubble-out: #3EB575; --ink: #E9E9E9; --muted: #8F8F8F; --line: #333333;
  --accent: #2DBE73; --accent-ink: #08130D; --card: #242424; --warn-bg: #3A2C10; --warn: #F2C97C; --err-bg: #3A1616; --err: #F4A3A3;
  --p1: #F08A55; --p2: #4CC398; --p3: #9A88F0; --p4: #5AA6E8; --p5: #E0B547; color-scheme: dark; }

[hidden] { display: none !important; } /* display rules below must not un-hide hidden elements */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); display: flex; }
.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
#side { flex: none; width: 260px; height: 100%; background: var(--bar); border-right: 1px solid var(--line); display: flex; flex-direction: column; box-sizing: border-box;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
body.side-closed #side { display: none; }
#side .new { font: 600 15px var(--f-body); color: var(--ink); background: var(--bubble-in); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; text-align: left; cursor: pointer; }
#side .lib-open { margin-top: 8px; font: 400 14px var(--f-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-align: left; cursor: pointer; }
#lib-dlg { width: min(560px, calc(100vw - 32px)); max-height: 85vh; border: 0; border-radius: 12px; padding: 12px 16px 16px; background: var(--bar); color: var(--ink); box-sizing: border-box; }
#lib-dlg::backdrop { background: rgba(0, 0, 0, .35); }
.lib-head { display: flex; justify-content: space-between; align-items: center; }
.lib-head h2 { margin: 0; font-size: 17px; }
#lib-dlg h3 { font-size: 13px; margin: 14px 0 6px; }
#lib-dlg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
#lib-dlg li { background: var(--bubble-in); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.lib-name { font-weight: 600; }
.lib-rules { font-size: 13px; color: var(--muted); }
.lib-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-acts button:disabled { color: var(--muted); cursor: default; }
.lib-acts button { font: 400 12px var(--f-body); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 12px; padding: 3px 9px; cursor: pointer; }
.lib-empty { color: var(--muted); font-size: 14px; }
#side h2 { font-size: 12px; font-weight: 400; color: var(--muted); margin: 14px 6px 6px; }
#threads { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; }
#threads button { display: grid; gap: 1px; text-align: left; font: 400 15px/1.35 var(--f-body); color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 0; }
#threads button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#threads button small { font-size: 12px; color: var(--muted); }
#threads button:hover { background: color-mix(in srgb, var(--muted) 12%, transparent); }
#threads button.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
#scrim { display: none; }
@media (max-width: 899px) {
  #side { position: fixed; inset: 0 auto 0 0; width: min(82vw, 300px); z-index: 30; transform: translateX(-102%); transition: transform .2s ease; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  body.side-closed #side { display: flex; }
  body.side-open #side { transform: none; }
  body.side-open #scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .35); }
}
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }
header .bar-row { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
header .hb { width: 36px; height: 36px; border: 0; background: none; color: var(--ink); font-size: 20px; border-radius: 6px; cursor: pointer; }
header .hb:hover { background: color-mix(in srgb, var(--muted) 12%, transparent); }
header h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
header { background: var(--bar); border-bottom: 1px solid var(--line); text-align: center; padding-block: 10px 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
header h1 { font-size: 17px; font-weight: 600; margin: 0; }
header button.settings-pill { margin-top: 4px; font: 400 12px var(--f-body); color: var(--muted); background: none; border: 0; padding: 2px 6px; cursor: pointer; }
#log { flex: 1; overflow-y: auto; padding-block: 12px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.day { align-self: center; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); border-radius: 4px; padding: 2px 8px; }
.msg { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; }
.msg.out { flex-direction: row-reverse; }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 5px; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: #fff; }
.msg.in .avatar { background: var(--p1); }
.msg.out .avatar { background: var(--p4); }
.bubble { position: relative; background: var(--bubble-in); border-radius: 6px; padding: 9px 12px; max-width: min(78%, 560px); min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.out .bubble { background: var(--bubble-out); color: #111; }
.bubble.wide { max-width: min(86%, 600px); width: 100%; white-space: normal; }
.bubble::before { content: ""; position: absolute; top: 13px; width: 0; height: 0; border: 6px solid transparent; }
.msg.in .bubble::before { left: -11px; border-right-color: var(--bubble-in); }
.msg.out .bubble::before { right: -11px; border-left-color: var(--bubble-out); }
.quote { font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 4px; padding: 4px 8px; margin-top: 4px; max-width: min(78%, 560px); }
.msg.out .stack { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; max-width: 100%; }
.msg.in .stack { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; max-width: 100%; }
.typing { color: var(--muted); }
.err-bubble { background: var(--err-bg) !important; color: var(--err) !important; }

/* plan card inside a bubble */
.plan h2 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
.plan .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 1px; margin-bottom: 8px; }
.bar span { display: flex; align-items: center; justify-content: center; color: #fff; font: 500 11px var(--f-mono); min-width: 0; overflow: hidden; white-space: nowrap; }
.phase { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }
.phase-title { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; color: var(--pc); }
details.drill { margin: 4px 0 0; background: var(--card); border-radius: 6px; padding: 6px 8px; }
details.drill > summary { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 15px; list-style: none; }
details.drill > summary > span:first-child::before { content: "▸ "; color: var(--muted); }
details.drill[open] > summary > span:first-child::before { content: "▾ "; }
.drill-wrap { margin-top: 6px; }
.drill-wrap > .detail { margin-top: 4px; }
details.drill > summary::-webkit-details-marker { display: none; }
details.drill > summary .mono { color: var(--muted); flex: none; }
details.drill[open] > summary { font-weight: 600; }
.drill dl { margin: 6px 0 2px; display: grid; gap: 6px; font-size: 14px; }
.drill dt { font-size: 12px; color: var(--muted); }
.drill dd { margin: 0; }
.drill .cue { font-weight: 600; color: var(--pc); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 8px; font-size: 13px; margin-bottom: 8px; }
.warnbox ul { margin: 2px 0 0; padding-left: 18px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.card-actions button { font: 400 13px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px 10px; cursor: pointer; }
.card-actions button.on { color: var(--accent); border-color: var(--accent); }
.drill-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.drill-tools button { font: 400 12px var(--f-body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 12px; padding: 3px 9px; cursor: pointer; }
.drill-tools button.on { color: var(--accent); border-color: var(--accent); }
.lib-note { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lib-note .detail-btn { margin-top: 0; font-size: 12px; padding: 3px 9px; }
.run { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; box-sizing: border-box;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.run-top { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.run-phase { color: var(--pc); font-weight: 600; flex: 1; }
.run-x { font-size: 20px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 4px 8px; }
.run-body { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 8px; padding: 8px 0; max-width: 640px; width: 100%; margin: 0 auto; }
.run-body h2 { margin: 0; font-size: 24px; }
.run-clock { font-size: clamp(64px, 22vw, 120px); font-weight: 600; line-height: 1; color: var(--pc); }
.run.over .run-clock { color: var(--err); animation: run-blink 1s steps(2) infinite; }
@keyframes run-blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .run.over .run-clock { animation: none; } }
.run-cue { font-size: 20px; font-weight: 600; }
.run-body p { margin: 0; }
.run-score { color: var(--muted); }
.run-note { font-size: 12px; color: var(--muted); }
.run-next { font-size: 14px; color: var(--muted); padding: 6px 0; text-align: center; }
.run-bar { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; }
.run-bar button, .run-end button { font: 600 16px var(--f-body); color: var(--ink); background: var(--bubble-in); border: 1px solid var(--line); border-radius: 10px; padding: 14px 6px; cursor: pointer; }
.run-bar button:disabled { opacity: .4; }
.run .run-main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.run-end { margin: auto; display: grid; gap: 12px; text-align: center; max-width: 360px; }
.run-end h2 { margin: 0; }
.run-end p { margin: 0; color: var(--muted); }
.run-end .run-ghost { background: none; }
.held-tag { display: inline-block; font-size: 12px; color: var(--accent); margin-left: 6px; font-weight: 400; }

/* drill detail: steps, mistakes, court diagram */
.detail-btn { font: 400 13px var(--f-body); color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 14px; padding: 5px 10px; cursor: pointer; margin-top: 6px; }
.detail { margin-top: 8px; display: grid; gap: 8px; font-size: 14px; }
.detail ol, .detail ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.detail h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 400; }
.court-wrap { display: grid; gap: 4px; }
.court { width: 100%; max-width: 360px; height: auto; display: block; background: var(--card); border-radius: 6px; }
.court .line { fill: none; stroke: var(--muted); stroke-width: .8; }
.court text { font: 600 7px var(--f-body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.court .nr text { fill: var(--ink); font-size: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.demo-btn { justify-self: start; font: 400 13px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  .court.demo .arw { opacity: 0; animation: step-in .5s ease-out forwards; animation-delay: var(--d); }
}
@keyframes step-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

/* composer */
footer { background: var(--bar); border-top: 1px solid var(--line); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.quick button { flex: none; font: 400 13px var(--f-body); color: var(--ink); background: var(--bubble-in); border: 1px solid var(--line); border-radius: 14px; padding: 5px 10px; cursor: pointer; }
.replying { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 4px; padding: 4px 8px; }
.replying button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; }
.row { display: flex; gap: 8px; align-items: flex-end; }
#text { flex: 1; min-width: 0; resize: none; max-height: 120px; font: 400 16px/1.4 var(--f-body); color: var(--ink); background: var(--bubble-in); border: 0; border-radius: 6px; padding: 9px 10px; }
.icon-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--muted); background: none; color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
#send { flex: none; font: 600 15px var(--f-body); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
#send:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* settings sheet */
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35); display: flex; align-items: flex-end; }
#sheet .panel { background: var(--bar); width: 100%; border-radius: 12px 12px 0 0; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
#sheet h2 { font-size: 16px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
label input, label select { font: 400 16px var(--f-body); color: var(--ink); background: var(--bubble-in); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
#sheet .done { justify-self: end; font: 600 15px var(--f-body); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
</style>

<aside id="side" aria-label="历史对话">
  <button type="button" class="new" id="side-new">＋ 新对话</button>
  <h2>历史对话</h2>
  <nav id="threads"></nav>
  <button type="button" class="lib-open" id="open-lib">练习库</button>
</aside>
<dialog id="lib-dlg" aria-label="练习库"></dialog>
<div id="scrim"></div>
<div class="main">
<header class="wrap">
  <div class="bar-row">
    <button type="button" class="hb" id="toggle-side" aria-label="展开或收起历史对话">☰</button>
    <h1 id="title">篮球备课助手</h1>
    <button type="button" class="hb" id="new-chat" aria-label="新对话">✎</button>
  </div>
  <button type="button" class="settings-pill" id="settings-pill" aria-label="修改上课条件"></button>
</header>

<div id="log" class="wrap" aria-live="polite"></div>

<footer class="wrap">
  <div class="quick" id="quick"></div>
  <div class="replying" id="replying" hidden><span id="replying-text"></span><button type="button" id="replying-x" aria-label="取消引用">×</button></div>
  <form class="row" id="composer">
    <button type="button" class="icon-btn" id="open-sheet" aria-label="上课条件">+</button>
    <textarea id="text" rows="1" placeholder="说说今天想练什么…" aria-label="消息"></textarea>
    <button type="submit" id="send">发送</button>
  </form>
</footer>

</div>
<div id="sheet" hidden>
  <div class="panel wrap" role="dialog" aria-label="上课条件">
    <h2>上课条件</h2>
    <div class="grid">
      <label for="f-dauer">时长（分钟）<input id="f-dauer" type="number" min="45" max="150" step="5" value="90"></label>
      <label for="f-spieler">人数<input id="f-spieler" type="number" min="2" max="40" value="12"></label>
      <label for="f-koerbe">篮筐<input id="f-koerbe" type="number" min="1" max="12" value="2"></label>
      <label for="f-spiel">比赛至少（分钟）<input id="f-spiel" type="number" min="20" max="60" value="20"></label>
    </div>
    <label for="f-material">器材<input id="f-material" type="text" value="12个球，20个标志桶，2套对抗背心"></label>
    <label for="f-sprache">练习内容的语言<select id="f-sprache"><option value="zh">中文</option><option value="de">Deutsch（给德国助教看）</option></select></label>
    <label class="check" for="f-kalt"><input id="f-kalt" type="checkbox" checked>天冷：先把核心体温提上来</label>
    <button type="button" class="done" id="close-sheet">完成</button>
  </div>
</div>

<script src="runtime.js"></script>
<script>
"use strict";
const PHASES = [
  { id: "aufwaermen",   name: "热身",       de: "Aufwärmen",                 color: "var(--p1)", hint: "跑动游戏，先把核心体温提上来" },
  { id: "mobilisation", name: "灵活与弹跳", de: "Mobilisation & Sprungkraft", color: "var(--p2)", hint: "动态拉伸做成游戏，单脚跳等弹性练习" },
  { id: "aktivierung",  name: "神经激活",   de: "Neuro-Aktivierung",         color: "var(--p3)", hint: "反应游戏，如头-胸-球、两人抢球，每周换花样" },
  { id: "technik",      name: "技术",       de: "Technik",                   color: "var(--p4)", hint: "本周重点做成对抗或比赛形式" },
  { id: "spiel",        name: "比赛",       de: "Abschlussspiel",            color: "var(--p5)", hint: "真比赛，加一条和重点相关的规则" },
];
const RECENT_N = 4;
/** Output language of the drill content. The page itself stays Chinese. Old messages have no setting: Chinese. */
const isDe = (input) => !!input && input.sprache === "de";
const $ = (id) => document.getElementById(id);
/** The artifact runtime hands out frozen values (database rows, Claude's parsed JSON); the page edits plans in place, so copy them on the way in. */
const editable = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
const state = { gen: 0, ready: false, sample: null, db: null, uid: null, tid: null, threads: [], held: [], lib: new Map(), msgs: [], replyTo: null, ctl: null };

/* ---------- pure logic ---------- */
const norm = (s) => String(s || "").toLowerCase().replace(/[\s\p{P}]+/gu, "");
function drillNames(plans, phaseId) {
  const out = [];
  plans.forEach((pl) => (Array.isArray(pl && pl.phasen) ? pl.phasen : [])

  const ids = plan.phasen.map((p) => p && p.id);
  if (ids.join(",") !== PHASES.map((p) => p.id).join(",")) probs.push(`五段顺序不对，应为：${PHASES.map((p) => p.name).join(" → ")}。`);

  const notLiked = new Set(disliked.map(norm));
  plan.phasen.forEach((p) => {
    if (!p) return;
    const name = (PHASES.find((x) => x.id === p.id) || { name: p.id }).name;
    const drills = Array.isArray(p.uebungen) ? p.uebungen : [];
    if (!drills.length) probs.push(`「${name}」没有练习。`);
    let sum = 0;
    drills.forEach((u, i) => {
      const m = Number(u && u.minuten);
      if (!Number.isInteger(m) || m <= 0) probs.push(`「${name}」第 ${i + 1} 个练习没有有效分钟数。`);

        if (!u || typeof u[k] !== "string" || !u[k].trim()) probs.push(`「${name}」第 ${i + 1} 个练习缺少「${k}」。`);

      if (n && seen.has(n)) probs.push(`练习「${u.name}」重复出现。`);
      if (n && notLiked.has(n)) probs.push(`「${u.name}」孩子不喜欢（教练点过👎），换一个。`);
      seen.add(n);
    });
    if (Number(p.minuten) !== sum) probs.push(`「${name}」标了 ${p.minuten} 分钟，练习加起来是 ${sum} 分钟。`);

  if (mins("spiel") < input.spielMin) probs.push(`比赛只有 ${mins("spiel")} 分钟，至少要 ${input.spielMin} 分钟。`);
  // ponytail: fixed 10-minute floor for a cold hall; make it a setting if it turns out too strict
  if (input.kalt && mins("aufwaermen") < 10) probs.push(`天冷，热身只有 ${mins("aufwaermen")} 分钟，至少要 10 分钟。`);
  const used = new Set(drillNames(recentPlans, "aktivierung").map(norm));
  const akt = plan.phasen.find((p) => p && p.id === "aktivierung");
  (akt && Array.isArray(akt.uebungen) ? akt.uebungen : []).forEach((u) => {
    if (used.has(norm(u && u.name))) probs.push(`神经激活「${u.name}」最近 ${RECENT_N} 节课已经上过。`);

    console.error("detail failed", e);
    err = `画图失败：${ERR_COPY[e && e.code] || "请求失败"}（代码：${e && e.code}${e && e.message ? "，" + e.message : ""}）`;
  } finally {
    loadingDrills.delete(u);
    refill(u, err);
    // last picture done: rebuild the card once so "给整节课画图" goes away
    if (!err && !drillsOf(m.plan).some(needsPicture) && (m.tid || state.tid) === state.tid) { bubbleCache.delete(m); renderLog(); }

}
/** Draws every drill of a plan one after another (one database write at a time per message). */
const drawing = new WeakSet();
/** One run per message. Stops once the coach leaves the thread: reopening loads fresh objects, drawing on the old ones would race them. */
async function drawAll(m) {
  if (!m.plan || !Array.isArray(m.plan.phasen) || drawing.has(m)) return;
  drawing.add(m);
  try { await drawEach(m); } finally { drawing.delete(m); }
}
async function drawEach(m) {
  for (let pi = 0; pi < m.plan.phasen.length; pi++) {
    const drills = m.plan.phasen[pi].uebungen || [];
    for (let ui = 0; ui < drills.length; ui++) {
      if (!state.msgs.includes(m)) return;
      if (needsPicture(drills[ui])) await loadDetail(m, pi, ui, drills[ui]);
    }
  }
}

function dayLabel(ts) {
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "short" }) + " " + d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
}
const bubbleCache = new WeakMap(); // message → {key, node}: re-renders reuse the node, so pictures are not rebuilt and open sections stay open
/** Rebuilds a message only when something it shows changed; global changes (library edits) bump state.gen. */
function bubble(m) {
  const key = [state.gen, m.id, m.held, m.quote, !!state.sample, !!state.db, m.text].join("|");
  const hit = bubbleCache.get(m);
  if (hit && hit.key === key) return hit.node;

function buildBubble(m) {

  if (m.text) b.append(m.plan ? el("div", { style: "white-space:pre-wrap;margin-bottom:8px" }, m.text) : m.text);
  if (m.plan) b.append(planCard(m));

  return el("div", { className: "msg " + (out ? "out" : "in"), "data-id": m.id || "" }, el("div", { className: "avatar", "aria-hidden": "true" }, out ? "我" : "助"), stack);
}
const dayNodes = new Map(); // first message ts of a day → its separator, reused like bubbles
function renderLog(extra) {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const nodes = [];
  if (!state.msgs.length) {
    nodes.push(bubble({ role: "agent", text: "你好，我是备课助手。直接说今天想练什么，比如：\n「这周练快攻，长传和2打1，孩子最近注意力差，多点比赛。」\n我会按 热身 → 灵活与弹跳 → 神经激活 → 技术 → 比赛 排好一节课。不满意就直接说哪里要改。" }));
  }
  let lastDay = "";
  state.msgs.forEach((m) => {
    const d = m.ts ? new Date(m.ts).toDateString() : "";
    if (d && d !== lastDay) {
      if (!dayNodes.has(m.ts)) dayNodes.set(m.ts, el("div", { className: "day" }, dayLabel(m.ts)));
      nodes.push(dayNodes.get(m.ts)); lastDay = d;
    }
    nodes.push(bubble(m));
  });
  (extra || []).forEach((m) => nodes.push(bubble(m)));
  // keep the unchanged leading nodes in place; only the changed tail is swapped
  let same = 0;
  while (same < nodes.length && log.children[same] === nodes[same]) same++;
  while (log.children.length > same) log.lastChild.remove();
  log.append(...nodes.slice(same));
  if (atBottom || extra) log.scrollTop = log.scrollHeight;
}
function renderQuick() {

    ? ["换一个神经激活游戏", "热身再好玩一点", "技术段更多对抗", "比赛加一条快攻规则", "同样重点，出一节新课"]
    : ["这周练快攻：长传和2打1", "练接球投篮，多点比赛", "练防守脚步，孩子注意力差"];

function setReplyTo(m) {

/* ---------- storage, all private per coach under data/users/<id>:
   <tid>            thread doc {kind:"thread", title, createdAt, updatedAt}; "chat" is the original single chat
   <tid>/msgs/*     that thread's messages
   h_<tid>_<msgId>  {kind:"held", ts, tid, plan}: held sessions across all threads, feeds the no-repeat rule ---------- */
const userCol = () => state.db.collection(`data/users/${state.uid}`);
const msgsRef = (tid = state.tid) => state.db.collection(`data/users/${state.uid}/${tid}/msgs`);
const byNewest = (k) => (a, b) => (String(a[k]) < String(b[k]) ? 1 : -1);
async function loadThreads() {
  const snap = await userCol().where("kind", "==", "thread").get();
  state.threads = snap.docs.map((d) => ({ id: d.id, ...editable(d.data()) }));
  if (!state.threads.some((t) => t.id === "chat")) { // the chat from before threads existed: give it a thread doc, keep every message
    const first = await msgsRef("chat").orderBy("ts", "asc").limit(1).get();
    if (!first.empty) {
      const last = await msgsRef("chat").orderBy("ts", "desc").limit(1).get();
      const f = first.docs[0].data();
      const meta = { kind: "thread", title: String(f.text || "之前的对话").slice(0, 24), createdAt: f.ts || new Date().toISOString(), updatedAt: last.docs[0].data().ts || f.ts || new Date().toISOString() };
      await userCol().doc("chat").set(meta);
      state.threads.push({ id: "chat", ...meta });
    }
  }
  state.threads.sort(byNewest("updatedAt"));
  renderSide();
}
async function loadHeld() {
  const snap = await userCol().where("kind", "==", "held").get();
  state.held = recentHeld(snap.docs.map((d) => editable(d.data())), RECENT_N);
}
function renderLibBtn() {
  const n = [...state.lib.values()].filter((x) => x.rating === "up").length;
  $("open-lib").textContent = n ? `练习库 · 👍 ${n}` : "练习库";
}
function openLib() {
  const dlg = $("lib-dlg");
  const item = (x) => {
    const key = libKey(x.name);
    const blocked = x.phase === "aktivierung" && drillNames(state.held, "aktivierung").map(norm).includes(norm(x.name)); // the no-repeat rule would reject it
    const use = el("button", { type: "button", disabled: blocked }, blocked ? `最近${RECENT_N}节上过，之后再排` : "排进下节课");
    use.addEventListener("click", () => { dlg.close(); if (isPhone()) toggleSide(false); $("text").value = `下节课用上「${x.name}」`; autoGrow(); $("text").focus(); });
    const rm = el("button", { type: "button" }, x.rating === "up" ? "移出练习库" : "恢复（不再排除）");
    rm.addEventListener("click", async () => {
      rm.disabled = true;
      try { await userCol().doc(key).delete(); state.lib.delete(key); paint(); renderLibBtn(); state.gen++; renderLog(); }
      catch (e) { console.error("library delete failed", e); rm.disabled = false; rm.textContent = `没删掉（${e && e.code}）`; }
    });
    return el("li", {}, el("div", { className: "lib-name" }, x.name),
      x.drill && x.drill.regeln ? el("div", { className: "lib-rules" }, x.drill.regeln) : null,
      el("div", { className: "lib-acts" }, x.rating === "up" ? use : null, rm));
  };
  const paint = () => {
    const { liked, disliked } = libGroups([...state.lib.values()]);
    const empty = !state.db ? "请先登录。"
      : !liked.length && !disliked.length ? "还没有评价过的练习。上完课点「标记已上课」，再给每个练习点 👍 或 👎，就会出现在这里。" : "";
    dlg.replaceChildren(...[
      el("div", { className: "lib-head" }, el("h2", {}, "练习库"), el("button", { type: "button", className: "run-x", "aria-label": "关闭练习库", onclick: () => dlg.close() }, "✕")),
      empty ? el("p", { className: "lib-empty" }, empty) : null,
      liked.map((g) => el("section", {}, el("h3", { style: `color:${phaseMeta(g.phase).color}` }, `${phaseMeta(g.phase).name} · 👍`), el("ul", {}, g.items.map(item)))),
      disliked.length ? el("section", {}, el("h3", {}, "👎 不再排的"), el("ul", {}, disliked.map(item))) : null].flat().filter(Boolean));
  };
  paint();

async function loadLib() {
  const snap = await userCol().where("kind", "==", "lib").get();
  state.lib = new Map(snap.docs.map((d) => [d.id, editable(d.data())]));
  renderLibBtn();
}
/** Creates the thread for a new chat. Switches the view to it only if the coach has not navigated away meanwhile. */
async function ensureThread(firstText, signal) {
  if (state.tid || !state.db) return state.tid;
  const now = new Date().toISOString();
  const tid = "t_" + Date.now().toString(36);
  const meta = { kind: "thread", title: firstText.replace(/\s+/g, " ").slice(0, 24), createdAt: now, updatedAt: now };
  await userCol().doc(tid).set(meta);
  state.threads.unshift({ id: tid, ...meta });
  if (!(signal && signal.aborted)) { state.tid = tid; rememberThread(); renderTitle(); }
  renderSide();
  return tid;
}
async function touchThread(tid = state.tid) {
  const t = state.threads.find((x) => x.id === tid);
  if (!t || !state.db) return;
  t.updatedAt = new Date().toISOString();
  try { await userCol().doc(t.id).update({ updatedAt: t.updatedAt }); }
  catch (e) { console.error("thread time not saved", e); }
  state.threads.sort(byNewest("updatedAt")); renderSide();
}
function rememberThread() { try { localStorage.setItem("u12-thread", state.tid || ""); } catch (e) { console.warn("thread not remembered", e); } }
const isPhone = () => window.matchMedia("(max-width: 899px)").matches;
function toggleSide(force) {
  if (isPhone()) { document.body.classList.toggle("side-open", force); return; }
  const closed = document.body.classList.toggle("side-closed", force === undefined ? undefined : !force);
  try { localStorage.setItem("u12-side", closed ? "closed" : "open"); } catch (e) { console.warn("side state not stored", e); }
}
function renderTitle() {
  const t = state.threads.find((x) => x.id === state.tid);
  $("title").textContent = t ? t.title : "新对话";
}
function renderSide() {
  const list = state.threads.map((t) => {
    const b = el("button", { type: "button", className: t.id === state.tid ? "active" : "" },
      el("span", {}, t.title || "未命名"), el("small", {}, dayLabel(t.updatedAt)));
    b.addEventListener("click", () => openThread(t.id));
    return b;
  });
  $("threads").replaceChildren(...(list.length ? list : [el("small", { style: "color:var(--muted);padding:8px 10px" }, state.db ? "还没有对话。发第一条消息就会出现在这里。" : "请先登录。")]));
}
async function openThread(tid) {
  if (tid && tid === state.tid) { if (isPhone()) toggleSide(false); return; } // re-tapping the open chat must not cancel a reply
  if (state.ctl) { state.ctl.abort(); state.ctl = null; $("send").textContent = "发送"; }
  state.tid = tid; state.msgs = []; setReplyTo(null);
  rememberThread(); renderSide(); renderTitle(); renderLog(); renderQuick();
  if (isPhone()) toggleSide(false);
  if (tid) await loadMsgs();
}
async function persist(m, tid = state.tid) {
  if (!state.db || !tid) return;
  const { id, typing, ...data } = m;
  try { const ref = await msgsRef(tid).add(data); m.id = ref.id; }
  catch (e) { console.error("message not saved", e); if (tid === state.tid) notice(`这条消息没存上（${e && e.code}），刷新后会消失。`); }
}
/** Message flag and held doc change together; if the second write fails the first is undone, so the no-repeat list stays right. */
async function toggleHeld(m, btn) {
  const tid = m.tid || state.tid;
  const want = !m.held;
  const hid = `h_${tid}_${m.id}`;
  btn.disabled = true;
  try {
    await msgsRef(tid).doc(m.id).update({ held: want });
    try {
      if (want) await userCol().doc(hid).set({ kind: "held", ts: m.ts, heldAt: new Date().toISOString(), tid, plan: JSON.parse(planJson(m.plan)) });
      else await userCol().doc(hid).delete();
    } catch (e) {
      try { await msgsRef(tid).doc(m.id).update({ held: !want }); }
      catch (e2) { console.error("held rollback failed", e2); notice(`「已上课」记录不完整（${e2 && e2.code}），刷新后再点一次。`); }
      throw e;
    }
  } catch (e) {
    console.error("held toggle failed", e);
    btn.disabled = false;
    btn.textContent = `记录失败（${e && e.code}）`;
    return;
  }
  m.held = want;
  try { await loadHeld(); }
  catch (e) { console.error("held list not refreshed", e); notice(`已记录，但避免重复的列表没刷新（${e && e.code}），刷新页面即可。`); }
  if (tid === state.tid) renderLog();
}
async function loadMsgs() {
  const tid = state.tid;
  state.loading = tid;
  const timer = setTimeout(() => { if (tid === state.tid) notice("聊天记录加载超时，刷新页面再试。"); }, 10000);
  try {
    // ponytail: loads the newest 200 messages of the thread; paginate if one thread grows past that
    const snap = await msgsRef(tid).orderBy("ts", "desc").limit(200).get();
    clearTimeout(timer);
    if (tid !== state.tid) return; // coach switched threads meanwhile
    state.msgs = snap.docs.map((d) => { const m = { id: d.id, ...editable(d.data()), tid }; if (m.plan) m.plan = cleanPlan(m.plan); return m; }).reverse(); // tid in memory: later writes never guess the thread
    renderLog(); renderQuick();
  } catch (e) {
    clearTimeout(timer);
    console.error("history failed", e);
    if (tid === state.tid) notice(`聊天记录加载失败（${e && e.code}）。可以继续用，但不会避开重复练习。`);
  } finally {
    if (state.loading === tid) state.loading = null;
  }
}
function notice(text) { state.msgs.push({ role: "agent", ts: new Date().toISOString(), text, error: true }); renderLog(); }

/* ---------- send ---------- */
async function send(ev) {
  if (ev) ev.preventDefault();
  const text = $("text").value.trim();
  if (!text || !state.sample || !state.ready || state.ctl) return;
  if (state.loading) { notice("聊天记录还在加载，稍等再发。"); return; }
  const input = readInput();
  const bad = inputProblems(input);
  if (bad.length) { notice("上课条件有问题：" + bad.join("；") + "。点左下角 + 修改。"); return; }
  const ctl = (state.ctl = new AbortController()); // busy from here: a second send waits, a thread switch cancels
  $("send").textContent = "停止"; $("send").disabled = false;
  const base = state.replyTo ? state.replyTo.plan : ([...state.msgs].reverse().find((m) => m.plan) || {}).plan || null;
  const coachMsg = { role: "coach", ts: new Date().toISOString(), text, quote: state.replyTo ? state.replyTo.id : undefined };
  if (!coachMsg.quote) delete coachMsg.quote;
  $("text").value = ""; autoGrow(); setReplyTo(null);
  state.msgs.push(coachMsg);
  let tid = state.tid;
  try { tid = await ensureThread(text, ctl.signal); }
  catch (e) { console.error("thread not created", e); notice(`对话没能保存（${e && e.code}），这次聊天刷新后会丢失。`); }
  if (tid) coachMsg.tid = tid;
  persist(coachMsg, tid);
  const here = () => state.tid === tid;
  const typing = { role: "agent", text: "对方正在输入…", typing: true };
  const showTyping = (t) => { typing.text = t; const b = $("log").querySelector(".msg:last-child .bubble.typing"); if (b) b.textContent = t; else if (here()) renderLog([typing]); };
  try {
    if (ctl.signal.aborted) throw { code: "cancelled" };
    renderLog([typing]);
    const recent = state.held;
    const lib = [...state.lib.values()];
    const disliked = lib.filter((x) => x.rating === "down").map((x) => x.name);
    const history = state.msgs.filter((x) => x !== coachMsg);
    let res = editable(await state.sample.json(chatPrompt(input, history, base, recent, text, lib), {
      signal: ctl.signal, cache: false,
      onText: ({ text: t }) => showTyping(`对方正在输入…（${t.length}字）`),
    }));
    let plan = res && res.plan ? cleanPlan(res.plan) : null;
    let problems = plan ? validatePlan(plan, input, recent, disliked) : [];
    let reply = (res && typeof res.reply === "string" && res.reply.trim()) || (plan ? "计划好了。" : "（没有收到回答）");
    if (problems.length) {
      showTyping(`检查发现 ${problems.length} 处问题，正在修正…`);
      const fixed = editable(await state.sample.json(repairPrompt(input, plan, problems, recent, lib), { signal: ctl.signal, cache: false }));
      if (fixed && fixed.plan) { plan = cleanPlan(fixed.plan); problems = validatePlan(plan, input, recent, disliked); if (fixed.reply) reply += "\n" + fixed.reply; }
    }
    const agentMsg = { role: "agent", ts: new Date().toISOString(), text: reply };
    if (plan) { carryDetails(plan, base); reuseDetails(plan, lib); Object.assign(agentMsg, { plan, problems, input, held: false }); }
    if (tid) agentMsg.tid = tid;
    if (here()) { state.msgs.push(agentMsg); renderLog([]); }
    await persist(agentMsg, tid);
    await touchThread(tid);
    if (here()) { renderLog([]); renderQuick(); }
    if (plan) drawAll(agentMsg);
  } catch (e) {
    if (e && e.code === "cancelled") { if (here()) renderLog(); }
    else {
      console.error("send failed", e);
      if (here()) notice(`出错了：${ERR_COPY[e && e.code] || "请求失败"}（代码：${e && e.code}${e && e.message ? "，" + e.message : ""}）`);
    }
  } finally {
    if (state.ctl === ctl) { state.ctl = null; $("send").textContent = "发送"; }
  }
}
const ERR_COPY = {
  not_granted: "登录已过期，请重新登录",
  sampling_disabled: "这个账号不能生成计划",
  rate_limited: "用量到上限了，稍后再试",
  invalid_json: "回答格式不对，再发一次",
  prompt_too_large: "内容太长，删掉一些聊天或换个短点的说法",
  upstream_error: "生成服务暂时连不上，再发一次",

function autoGrow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }

/* ---------- boot ---------- */
async function start() {
  loadSettings(); renderSettingsPill(); renderLog(); renderQuick();
  $("composer").addEventListener("submit", (ev) => { ev.preventDefault(); if (state.ctl) state.ctl.abort(); else send(); });
  $("text").addEventListener("input", autoGrow);
  $("replying-x").addEventListener("click", () => setReplyTo(null));
  const open = () => { $("sheet").hidden = false; $("f-dauer").focus(); };
  const close = () => { $("sheet").hidden = true; saveSettings(); renderSettingsPill(); };
  $("open-sheet").addEventListener("click", open);
  $("settings-pill").addEventListener("click", open);
  $("close-sheet").addEventListener("click", close);
  $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) close(); });
  $("send").disabled = true;
  try { if (localStorage.getItem("u12-side") === "closed") document.body.classList.add("side-closed"); }
  catch (e) { console.warn("side state not restored", e); }

  $("scrim").addEventListener("click", () => toggleSide(false));
  $("new-chat").addEventListener("click", () => openThread(null));
  $("side-new").addEventListener("click", () => openThread(null));
  $("open-lib").addEventListener("click", openLib);
  renderSide();

  const [sample, db, user] = await Promise.all([
    window.claude ? claude.use("sample") : null,
    window.claude ? claude.use("db") : null,
    window.claude ? claude.use("user") : null,
  ]);
  state.sample = sample;
  if (!sample) notice("现在不能生成计划：请先登录。");
  const uid = user ? await user.id() : null;
  if (db && uid) {
    state.db = db; state.uid = uid;
    try { await loadThreads(); }
    catch (e) { console.error("threads failed", e); notice(`历史对话列表加载失败（${e && e.code}）。`); }
    try { await loadHeld(); }
    catch (e) { console.error("threads failed", e); notice(`历史对话加载失败（${e && e.code}）。可以继续用，但不会避开重复练习。`); }
    try { await loadLib(); }
    catch (e) { console.error("library failed", e); notice(`练习库加载失败（${e && e.code}）。这次排课不会参考👍和👎。`); }
    let last = null;
    try { last = localStorage.getItem("u12-thread"); } catch (e) { console.warn("last thread not read", e); }
    const tid = state.threads.some((t) => t.id === last) ? last : (state.threads[0] || {}).id || null;
    await openThread(tid);
  }
  else notice("聊天记录不会保存：请先登录。");

  $("send").disabled = !sample;
}
start().catch((e) => { console.error("boot failed", e); notice("页面启动失败：" + (e && e.message)); });
